openapi: 3.1.0
info:
  title: Project Black Monolith service contracts
  version: 1.0.0
  description: Cross-module request, response, event, and correlation contracts.
servers:
  - url: http://127.0.0.1
paths:
  /retrieve:
    post:
      operationId: retrieveDocuments
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TraceId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/vector-anchor-api.v1.schema.json#/$defs/retrieveRequest"
      responses:
        "200":
          description: Clean retrieval results plus withheld candidates.
          content:
            application/json:
              schema:
                $ref: "./schemas/vector-anchor-api.v1.schema.json#/$defs/retrieveResponse"
  /admin/add-documents:
    post:
      operationId: addDocuments
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/vector-anchor-api.v1.schema.json#/$defs/addDocumentsRequest"
      responses:
        "200":
          description: Documents were added or replaced.
  /generate:
    post:
      operationId: auditGeneration
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TraceId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/trace-audit-api.v1.schema.json#/$defs/generateRequest"
      responses:
        "200":
          description: Server-sent stream of audited model output events.
          content:
            text/event-stream:
              schema:
                $ref: "./schemas/trace-audit-api.v1.schema.json#/$defs/streamEvent"
  /quarantine:
    get:
      operationId: listQuarantinedDocuments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Quarantined documents with bounded previews.
          content:
            application/json:
              schema:
                $ref: "./schemas/vector-anchor-api.v1.schema.json#/$defs/quarantineResponse"
  /quarantine/{doc_id}:
    delete:
      operationId: releaseQuarantinedDocument
      security:
        - bearerAuth: []
      parameters:
        - name: doc_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: The document was released and its retained hits reset.
          content:
            application/json:
              schema:
                $ref: "./schemas/vector-anchor-api.v1.schema.json#/$defs/releaseQuarantineResponse"
        "404":
          description: No quarantined document carries that id.
  /admin/replay-dead-letters:
    post:
      operationId: replayDeadLetters
      description: |
        VectorAnchor and TraceAudit requeue their dead-lettered outbox events.

        A module's outbox is shared by every tenant it serves, so the replay
        is scoped with the `tenant` query parameter: a tenant-scoped replay
        moves only that tenant's records and leaves everybody else's dead.
        Omitting the parameter replays the whole spool, which is the local
        operator's action rather than a tenant's. A `tenant` that cannot be
        read is refused with a 422 rather than ignored — a typo must never
        widen the replay.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant
          in: query
          required: false
          description: The tenant whose dead letters are requeued.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Number of records moved back to pending.
          content:
            application/json:
              schema:
                $ref: "./schemas/vector-anchor-api.v1.schema.json#/$defs/replayDeadLettersResponse"
        "422":
          description: The tenant could not be read, so the scope was refused.
          content:
            application/json:
              schema:
                type: object
                required: ["detail"]
                properties:
                  detail:
                    type: string
  /admin/reload-baseline:
    post:
      operationId: reloadTraceAuditBaseline
      description: |
        Hot-reload the TraceAudit KL baseline. An empty body reloads from the
        configured path; a body may carry a replacement `distribution` (or
        `counts`) mapping, which is validated and written atomically first.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                distribution:
                  type: object
                  additionalProperties: { "type": "number", "minimum": 0 }
      responses:
        "200":
          description: The baseline was validated and swapped into the live auditor.
          content:
            application/json:
              schema:
                type: object
                required: ["reloaded", "vocab_size"]
                properties:
                  reloaded: { "const": true }
                  vocab_size: { "type": "integer", "minimum": 1 }
  /v1/chat/completions:
    post:
      operationId: auditedChatCompletion
      description: |
        OpenAI-compatible entry point. The prompt is audited with the same
        divergence and PII pipeline as /generate; divergent streams terminate
        with `finish_reason: "content_filter"`. TraceAudit is a detector, not a
        general-purpose model proxy; the backend is configured server-side.
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TraceId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/trace-audit-api.v1.schema.json#/$defs/chatCompletionRequest"
      responses:
        "200":
          description: |
            A `chat.completion` object when `stream` is false, or a
            `text/event-stream` of `chat.completion.chunk` objects ending in
            `data: [DONE]` when `stream` is true.
          content:
            application/json:
              schema:
                $ref: "./schemas/trace-audit-api.v1.schema.json#/$defs/chatCompletionResponse"
            text/event-stream:
              schema:
                $ref: "./schemas/trace-audit-api.v1.schema.json#/$defs/chatCompletionChunk"
        "422":
          description: The request body is not a usable chat completion request.
  /api/ingest:
    post:
      operationId: ingestSecurityEvents
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "./schemas/event-envelope.v2.schema.json"
                - type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: "./schemas/event-envelope.v2.schema.json"
      responses:
        "201":
          description: |
            Events accepted for the tenant-scoped ledger. `revoked_sessions`
            lists the sessions currently quarantined for this tenant. It is a
            snapshot, not a delta, so a session that was quarantined earlier
            is still listed.
            The list is bounded — it carries the newest 128 live revocations,
            because the response body is read with a 64 KiB cap and a body
            that does not fit is cut short, fails to parse, and leaves the
            emitter holding the set it already had. The same set, with the
            bounds stated, is available without an event flow from
            `GET /api/sessions/revoked`.
            `revoked_sessions_complete` says whether the list is the whole
            set. An emitter that is told it is whole replaces its local
            mirror with it; an emitter that is told it is bounded adds to
            what it already holds, because a bounded list that claimed to be
            whole would drop every revocation the dashboard holds past the
            bound — and the session quarantined a moment ago would be served
            again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
  /api/sessions/revoked:
    get:
      operationId: readRevocationSnapshot
      description: |
        The tenant's live revoked sessions, newest first, bounded.

        The body is bounded because every module reads it with a 64 KiB cap.
        An unbounded set of live revocations is cut short by that cap, fails
        to parse, and leaves the module holding the set it already had — so a
        session revoked a moment ago is still served. The body therefore
        carries at most 128 revocations, and says whether that is all of
        them.

        A module applies the body according to `complete`:

          complete: true  -> replace the local revoked set with this one
          complete: false -> add to the local revoked set and keep what it has

        A truncated read, an unparseable body, or a failed request leaves the
        local set exactly as it was and is reported as an error. The
        revocation path fails closed: only an authoritative snapshot can
        lift a revocation.
      security:
        - bearerAuth: []
      parameters:
        - name: x-monolith-tenant-id
          in: header
          required: true
          schema: { "$ref": "#/components/schemas/CorrelationIdentity" }
        - name: x-monolith-module
          in: header
          required: true
          schema:
            type: string
            enum: ["mcp-shield", "vector-anchor", "trace-audit"]
      responses:
        "200":
          description: The tenant's live revoked sessions, bounded.
          content:
            application/json:
              schema:
                $ref: "./schemas/revocation-snapshot.v1.schema.json"
        "401":
          description: The caller is not a known module of that tenant.
        "503":
          description: The ledger could not be read; the caller keeps the set it has.
  /api/operations:
    get:
      operationId: readOperationsHealth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Ledger counts, per-module runtime probes, and alerting status.
          content:
            application/json:
              schema:
                type: object
    post:
      operationId: replayDeadLettersAcrossModules
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dead-letter replay results per module plus alert deliveries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsReplayResponse"
  /api/incidents/{eventId}/session:
    get:
      operationId: readIncidentSession
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { "type": "string", "format": "uuid" }
      responses:
        "200":
          description: The event's agent/session correlation across modules.
          content:
            application/json:
              schema:
                type: object
                required: ["session"]
                properties:
                  session: { "type": "object" }
        "404":
          description: The event carries no complete agent/session identity.
    post:
      operationId: quarantineIncidentSession
      description: Manually revoke the session that produced this event.
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { "type": "string", "format": "uuid" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { "type": "string", "minLength": 1, "maxLength": 512 }
      responses:
        "200":
          description: The session is revoked and returned with its updated state.
          content:
            application/json:
              schema:
                type: object
                required: ["session"]
                properties:
                  session: { "type": "object" }
    delete:
      operationId: restoreIncidentSession
      description: Lift the manual quarantine and let the breaker re-evaluate.
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { "type": "string", "format": "uuid" }
      responses:
        "200":
          description: The session revocation is lifted.
          content:
            application/json:
              schema:
                type: object
                required: ["session"]
                properties:
                  session: { "type": "object" }
  /api/benchmarks:
    post:
      operationId: uploadBenchmarkRun
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/benchmark-run.v1.schema.json"
      responses:
        "201":
          description: Benchmark run persisted.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    CorrelationIdentity:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[^\\u0000-\\u001f\\u007f]+$"
    IngestResponse:
      type: object
      required:
        [
          "accepted",
          "duplicates",
          "event_ids",
          "revoked_sessions",
          "revoked_sessions_complete",
          "revoked_sessions_truncated",
        ]
      properties:
        accepted: { "type": "integer", "minimum": 0 }
        duplicates: { "type": "integer", "minimum": 0 }
        event_ids:
          type: array
          items: { "$ref": "#/components/schemas/CorrelationIdentity" }
        revoked_sessions:
          type: array
          items: { "type": "string", "minLength": 1, "maxLength": 128 }
        revoked_sessions_complete:
          type: boolean
          description: |
            True when `revoked_sessions` is the tenant's entire live revoked
            set. An emitter that is told the list is whole replaces its local
            mirror with it; an emitter that is told it is bounded adds to the
            set it already holds.
        revoked_sessions_truncated:
          type: boolean
          description: |
            The same fact from the other side: the set did not fit the bound
            the body is read under, so the list is a part of the set.
    OperationsReplayResponse:
      type: object
      required: ["tenant_id", "alerts_replayed", "total_replayed", "modules"]
      properties:
        tenant_id: { "$ref": "#/components/schemas/CorrelationIdentity" }
        alerts_replayed: { "type": "integer", "minimum": 0 }
        total_replayed: { "type": "integer", "minimum": 0 }
        modules:
          type: array
          items:
            type: object
            required: ["module", "configured", "ok", "replayed"]
            properties:
              module: { "type": "string", "minLength": 1 }
              configured: { "type": "boolean" }
              ok: { "type": "boolean" }
              replayed: { "type": "integer", "minimum": 0 }
              status: { "type": "integer" }
              error: { "type": "string" }
  parameters:
    TenantId:
      name: x-monolith-tenant-id
      in: header
      required: false
      schema:
        $ref: "#/components/schemas/CorrelationIdentity"
    AgentId:
      name: x-monolith-agent-id
      in: header
      required: false
      schema:
        $ref: "#/components/schemas/CorrelationIdentity"
    SessionId:
      name: x-monolith-session-id
      in: header
      required: false
      schema:
        $ref: "#/components/schemas/CorrelationIdentity"
    TraceId:
      name: x-monolith-trace-id
      in: header
      required: false
      schema:
        $ref: "#/components/schemas/CorrelationIdentity"
    CorrelationId:
      name: x-monolith-correlation-id
      in: header
      required: false
      schema:
        $ref: "#/components/schemas/CorrelationIdentity"

openapi: 3.1.0
info:
  title: Project Black Monolith service contracts
  version: 1.0.0
  description: Cross-module request, response, event, and correlation contracts.
servers:
  - url: http://127.0.0.1
paths:
  /retrieve:
    post:
      operationId: retrieveDocuments
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TraceId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/vector-anchor-api.v1.schema.json#/$defs/retrieveRequest"
      responses:
        "200":
          description: Clean retrieval results plus withheld candidates.
          content:
            application/json:
              schema:
                $ref: "./schemas/vector-anchor-api.v1.schema.json#/$defs/retrieveResponse"
  /admin/add-documents:
    post:
      operationId: addDocuments
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/vector-anchor-api.v1.schema.json#/$defs/addDocumentsRequest"
      responses:
        "200":
          description: Documents were added or replaced.
  /generate:
    post:
      operationId: auditGeneration
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TraceId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/trace-audit-api.v1.schema.json#/$defs/generateRequest"
      responses:
        "200":
          description: Server-sent stream of audited model output events.
          content:
            text/event-stream:
              schema:
                $ref: "./schemas/trace-audit-api.v1.schema.json#/$defs/streamEvent"
  /quarantine:
    get:
      operationId: listQuarantinedDocuments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Quarantined documents with bounded previews.
          content:
            application/json:
              schema:
                $ref: "./schemas/vector-anchor-api.v1.schema.json#/$defs/quarantineResponse"
  /quarantine/{doc_id}:
    delete:
      operationId: releaseQuarantinedDocument
      security:
        - bearerAuth: []
      parameters:
        - name: doc_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: The document was released and its retained hits reset.
          content:
            application/json:
              schema:
                $ref: "./schemas/vector-anchor-api.v1.schema.json#/$defs/releaseQuarantineResponse"
        "404":
          description: No quarantined document carries that id.
  /admin/replay-dead-letters:
    post:
      operationId: replayDeadLetters
      description: |
        VectorAnchor and TraceAudit requeue their dead-lettered outbox events.

        A module's outbox is shared by every tenant it serves, so the replay
        is scoped with the `tenant` query parameter: a tenant-scoped replay
        moves only that tenant's records and leaves everybody else's dead.
        Omitting the parameter replays the whole spool, which is the local
        operator's action rather than a tenant's. A `tenant` that cannot be
        read is refused with a 422 rather than ignored — a typo must never
        widen the replay.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant
          in: query
          required: false
          description: The tenant whose dead letters are requeued.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Number of records moved back to pending.
          content:
            application/json:
              schema:
                $ref: "./schemas/vector-anchor-api.v1.schema.json#/$defs/replayDeadLettersResponse"
        "422":
          description: The tenant could not be read, so the scope was refused.
          content:
            application/json:
              schema:
                type: object
                required: ["detail"]
                properties:
                  detail:
                    type: string
  /admin/reload-baseline:
    post:
      operationId: reloadTraceAuditBaseline
      description: |
        Hot-reload the TraceAudit KL baseline. An empty body reloads from the
        configured path; a body may carry a replacement `distribution` (or
        `counts`) mapping, which is validated and written atomically first.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                distribution:
                  type: object
                  additionalProperties: { "type": "number", "minimum": 0 }
      responses:
        "200":
          description: The baseline was validated and swapped into the live auditor.
          content:
            application/json:
              schema:
                type: object
                required: ["reloaded", "vocab_size"]
                properties:
                  reloaded: { "const": true }
                  vocab_size: { "type": "integer", "minimum": 1 }
  /v1/chat/completions:
    post:
      operationId: auditedChatCompletion
      description: |
        OpenAI-compatible entry point. The prompt is audited with the same
        divergence and PII pipeline as /generate; divergent streams terminate
        with `finish_reason: "content_filter"`. TraceAudit is a detector, not a
        general-purpose model proxy; the backend is configured server-side.
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/TraceId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/trace-audit-api.v1.schema.json#/$defs/chatCompletionRequest"
      responses:
        "200":
          description: |
            A `chat.completion` object when `stream` is false, or a
            `text/event-stream` of `chat.completion.chunk` objects ending in
            `data: [DONE]` when `stream` is true.
          content:
            application/json:
              schema:
                $ref: "./schemas/trace-audit-api.v1.schema.json#/$defs/chatCompletionResponse"
            text/event-stream:
              schema:
                $ref: "./schemas/trace-audit-api.v1.schema.json#/$defs/chatCompletionChunk"
        "422":
          description: The request body is not a usable chat completion request.
  /api/ingest:
    post:
      operationId: ingestSecurityEvents
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "./schemas/event-envelope.v2.schema.json"
                - type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: "./schemas/event-envelope.v2.schema.json"
      responses:
        "201":
          description: |
            Events accepted for the tenant-scoped ledger. `revoked_sessions`
            lists the sessions currently quarantined for this tenant. It is a
            snapshot, not a delta: emitters replace their local mirror with
            it, so a session that was quarantined earlier is still listed.
            The same set is available without an event flow from
            `GET /api/sessions/revoked`.

            The snapshot is carried only while it fits in 16 KiB. A reader
            that reads a response body under a hard byte cap cannot parse a
            larger one, and a snapshot it cannot parse is a snapshot it keeps
            replacing with a stale one. So when the set does not fit, the
            response carries `revoked_sessions_total` alone and
            `revoked_sessions_complete: false`, and the whole set is read
            from the paged snapshot endpoint instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
  /api/sessions/revoked:
    get:
      operationId: readRevokedSessions
      description: |
        The tenant's quarantined sessions, for a module that has no event
        traffic of its own to learn the revocation from.

        The set is paged, because a module reads a response body under a
        hard byte cap and a set larger than that cap cannot be parsed at
        all. The answer says which it is:

        - `revoked_sessions_complete: true` — `revoked_sessions` is the
          whole set. Adopt it.
        - `revoked_sessions_complete: false` — `revoked_sessions` is one
          page. Follow `next_cursor` with `?cursor=…` until there is no
          cursor, and adopt the set only then.

        A partial set is never adopted: it would forget every revocation
        that is not on the pages read so far, and a forgotten revocation is a
        quarantined session that keeps working.
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: |
            Where the next page starts. A keyset on `(session_id, agent_id)`,
            base64url-encoded. A cursor that cannot be read is refused with
            422 rather than being turned into a query.
          schema: { "type": "string", "maxLength": 512 }
        - name: limit
          in: query
          required: false
          description: How many ids one page may carry.
          schema: { "type": "integer", "minimum": 1, "maximum": 500 }
      responses:
        "200":
          description: The whole set, or one page of it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevocationSnapshot"
        "401":
          description: The module credential or the tenant header is missing or wrong.
        "422":
          description: The cursor or the limit cannot be read.
  /api/operations:
    get:
      operationId: readOperationsHealth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Ledger counts, per-module runtime probes, and alerting status.
          content:
            application/json:
              schema:
                type: object
    post:
      operationId: replayDeadLettersAcrossModules
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dead-letter replay results per module plus alert deliveries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsReplayResponse"
  /api/incidents/{eventId}/session:
    get:
      operationId: readIncidentSession
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { "type": "string", "format": "uuid" }
      responses:
        "200":
          description: The event's agent/session correlation across modules.
          content:
            application/json:
              schema:
                type: object
                required: ["session"]
                properties:
                  session: { "type": "object" }
        "404":
          description: The event carries no complete agent/session identity.
    post:
      operationId: quarantineIncidentSession
      description: Manually revoke the session that produced this event.
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { "type": "string", "format": "uuid" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { "type": "string", "minLength": 1, "maxLength": 512 }
      responses:
        "200":
          description: The session is revoked and returned with its updated state.
          content:
            application/json:
              schema:
                type: object
                required: ["session"]
                properties:
                  session: { "type": "object" }
    delete:
      operationId: restoreIncidentSession
      description: Lift the manual quarantine and let the breaker re-evaluate.
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { "type": "string", "format": "uuid" }
      responses:
        "200":
          description: The session revocation is lifted.
          content:
            application/json:
              schema:
                type: object
                required: ["session"]
                properties:
                  session: { "type": "object" }
  /api/benchmarks:
    post:
      operationId: uploadBenchmarkRun
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/benchmark-run.v1.schema.json"
      responses:
        "201":
          description: Benchmark run persisted.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    CorrelationIdentity:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[^\\u0000-\\u001f\\u007f]+$"
    IngestResponse:
      type: object
      required: ["accepted", "duplicates", "event_ids"]
      properties:
        accepted: { "type": "integer", "minimum": 0 }
        duplicates: { "type": "integer", "minimum": 0 }
        event_ids:
          type: array
          items: { "$ref": "#/components/schemas/CorrelationIdentity" }
        revoked_sessions:
          description: |
            The tenant's quarantined sessions, present only while the set
            fits in 16 KiB. A reader that gets a response without it keeps
            the set it already had, which is what it already did.
          type: array
          items: { "type": "string", "minLength": 1, "maxLength": 128 }
        revoked_sessions_complete:
          description: Whether `revoked_sessions` is the whole set.
          type: boolean
        revoked_sessions_total:
          description: How many sessions the tenant has quarantined.
          type: integer
          minimum: 0
    RevocationSnapshot:
      type: object
      required: ["tenant_id", "generated_at_ms", "revoked_sessions", "revoked_sessions_complete"]
      properties:
        tenant_id: { "$ref": "#/components/schemas/CorrelationIdentity" }
        generated_at_ms: { "type": "integer", "minimum": 0 }
        revoked_sessions:
          description: |
            The whole set, or one page of it. `null` when the set does not
            fit in one response and the reader has to page it.
          type: [array, "null"]
          items: { "type": "string", "minLength": 1, "maxLength": 128 }
        revoked_sessions_complete:
          description: Whether `revoked_sessions` is the whole set.
          type: boolean
        revoked_sessions_total:
          description: How many sessions the tenant has quarantined.
          type: integer
          minimum: 0
        next_cursor:
          description: Where the next page starts. Absent when there is none.
          type: [string, "null"]
          maxLength: 512
    OperationsReplayResponse:
      type: object
      required: ["tenant_id", "alerts_replayed", "total_replayed", "modules"]
      properties:
        tenant_id: { "$ref": "#/components/schemas/CorrelationIdentity" }
        alerts_replayed: { "type": "integer", "minimum": 0 }
        total_replayed: { "type": "integer", "minimum": 0 }
        modules:
          type: array
          items:
            type: object
            required: ["module", "configured", "ok", "replayed"]
            properties:
              module: { "type": "string", "minLength": 1 }
              configured: { "type": "boolean" }
              ok: { "type": "boolean" }
              replayed: { "type": "integer", "minimum": 0 }
              status: { "type": "integer" }
              error: { "type": "string" }
  parameters:
    TenantId:
      name: x-monolith-tenant-id
      in: header
      required: false
      schema:
        $ref: "#/components/schemas/CorrelationIdentity"
    AgentId:
      name: x-monolith-agent-id
      in: header
      required: false
      schema:
        $ref: "#/components/schemas/CorrelationIdentity"
    SessionId:
      name: x-monolith-session-id
      in: header
      required: false
      schema:
        $ref: "#/components/schemas/CorrelationIdentity"
    TraceId:
      name: x-monolith-trace-id
      in: header
      required: false
      schema:
        $ref: "#/components/schemas/CorrelationIdentity"
    CorrelationId:
      name: x-monolith-correlation-id
      in: header
      required: false
      schema:
        $ref: "#/components/schemas/CorrelationIdentity"

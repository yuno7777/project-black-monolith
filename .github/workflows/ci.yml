name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job only checks out and tests the repository. Keep the ephemeral
# GITHUB_TOKEN read-only so a compromised build step cannot mutate repository
# contents, issues, packages, or workflow state.
permissions:
  contents: read

jobs:
  contracts:
    name: Shared contracts (JSON Schema + OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned contract validators
        run: pip install -r contracts/requirements.txt
      - name: Validate schemas, fixtures, and correlation headers
        run: python contracts/check_contracts.py

  mcp-shield:
    name: MCP-Shield (Rust build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-shield
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: rustfmt, clippy
      # The outbox verification spawns fixtures/fake_mcp_server.py as the
      # proxied server and fixtures/fake_ingest.js as the stand-in dashboard.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Format and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked --verbose
      - name: Test
        run: cargo test --locked --verbose
      - name: Rust dependency vulnerability gate
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: mcp-shield
      - name: Verify the durable outbox (spool / redeliver / dead-letter)
        run: bash fixtures/verify_outbox.sh

  python-common:
    name: Shared Python delivery (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked quality tools
        run: python -m pip install --require-hashes -r requirements-quality.lock
      - name: Lint, type-check, and test
        env:
          PYTHONPATH: python-common
        run: |
          python -m ruff check python-common/monolith_events
          python -m mypy python-common/monolith_events
          python -m pytest python-common/tests -q

  vector-anchor:
    name: VectorAnchor (Python tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vector-anchor
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock -r ../requirements-quality.lock
      - name: Lint and type-check
        run: |
          python -m ruff check ../python-common/monolith_events src
          python -m mypy ../python-common/monolith_events
          python -m mypy src
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Detection-accuracy benchmark (gated, deterministic)
        run: python fixtures/benchmark_detection.py

  trace-audit:
    name: TraceAudit (Python tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trace-audit
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock -r ../requirements-quality.lock
      - name: Lint and type-check
        run: |
          python -m ruff check ../python-common/monolith_events src
          python -m mypy ../python-common/monolith_events
          python -m mypy src
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Detection-accuracy benchmark (gated, deterministic)
        run: python fixtures/benchmark_detection.py

  dashboard:
    name: Dashboard (Next.js build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high
      - name: Dashboard contract tests
        run: npm test
      - name: Dashboard lint
        run: npm run lint
      - name: Build
        run: npm run build

  integration:
    name: Integration (ingest contract + outage recovery)
    runs-on: ubuntu-latest
    # The unit suites are cheap and catch most breakage; only pay for the
    # 5-image stack build once they are green.
    needs: [contracts, mcp-shield, python-common, vector-anchor, trace-audit, dashboard]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Generate local secrets
        # Ephemeral per-run credentials; nothing here is a real secret, and
        # .env is gitignored so none of it can be committed.
        run: bash scripts/generate_secrets.sh
      - name: Bring the stack up
        run: docker compose up -d --build --wait
      - name: Verify the ingestion contract
        run: bash scripts/verify_ingest.sh
      - name: Verify outage recovery (spool -> drain)
        run: bash scripts/verify_recovery.sh
      - name: Verify the incident lifecycle
        run: bash scripts/verify_incidents.sh
      - name: Verify cross-layer correlation
        run: bash scripts/verify_correlation.sh
      - name: Verify the benchmark ledger (auth / integrity / isolation)
        run: bash scripts/verify_benchmarks.sh
      - name: Run the full three-attack demo
        run: ./run_full_demo.sh
      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=120
      - name: Tear the stack down
        if: always()
        run: docker compose down -v
